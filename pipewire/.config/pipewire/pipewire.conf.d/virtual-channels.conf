# Configuración de canales de audio y micrófonos virtuales para PipeWire
context.modules = [
    # --- CANALES DE SALIDA (SINKS) ---

    # 1. Canal Escritorio
    { name = libpipewire-module-loopback
        args = {
            node.description = "Audio Escritorio"
            capture.props = {
                node.name = "sink_escritorio"
                media.class = "Audio/Sink"
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name = "playback_escritorio"
                node.passive = true
            }
        }
    }

    # 2. Canal Juegos
    { name = libpipewire-module-loopback
        args = {
            node.description = "Audio Juegos"
            capture.props = {
                node.name = "sink_juegos"
                media.class = "Audio/Sink"
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name = "playback_juegos"
                node.passive = true
            }
        }
    }

    # 3. Canal Llamadas
    { name = libpipewire-module-loopback
        args = {
            node.description = "Audio Llamadas"
            capture.props = {
                node.name = "sink_llamadas"
                media.class = "Audio/Sink"
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name = "playback_llamadas"
                node.passive = true
            }
        }
    }

    # --- CANALES DE ENTRADA / MICRÓFONOS (SOURCES) ---

    # 4. Micrófono Escritorio (Virtual)
    { name = libpipewire-module-loopback
        args = {
            node.description = "Micrófono Virtual Escritorio"
            capture.props = {
                node.name = "source_mic_escritorio_input"
                node.passive = true
            }
            playback.props = {
                node.name = "source_mic_escritorio"
                media.class = "Audio/Source"
                audio.position = [ MONO ]
            }
        }
    }

    # 5. Micrófono OBS (Virtual)
    { name = libpipewire-module-loopback
        args = {
            node.description = "Micrófono Virtual OBS"
            capture.props = {
                node.name = "source_mic_obs_input"
                node.passive = true
            }
            playback.props = {
                node.name = "source_mic_obs"
                media.class = "Audio/Source"
                audio.position = [ MONO ]
            }
        }
    }
]
