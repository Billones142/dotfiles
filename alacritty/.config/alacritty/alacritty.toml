[terminal]
shell = { program = "/bin/bash", args = ["-l"] }

[window]
opacity = 0.6
blur = false
dynamic_title = true

[font]
size = 11.25
#normal = { family = "monospace", style = "Regular" }
normal = { family = "Source Code Pro", style = "Regular" }
#normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
#normal = { family = "Fira Code Nerd Font", style = "Regular" }
#normal = { family = "Hack Nerd Font", style = "Regular" }
#normal = { family = "Iosevka Nerd Font", style = "Regular" }
#normal = { family = "", style = "Regular" }
bold = { style = "Bold" }
italic = { style = "Italic" }
bold_italic = { style = "Bold Italic" }
offset = { x = 0, y = 0 }
glyph_offset = { x = 0, y = 0 }
builtin_box_drawing = true

[colors.bright]
black = "0x4D4D4D"
blue = "0xE1A8FF"
cyan = "0xA4FFFF"
green = "0x69FF94"
magenta = "0xFF9EFA"
red = "0xFF6E6E"
white = "0xFFFFFF"
yellow = "0xFFFFA5"

[colors.cursor]
cursor = "0xFFFFFF"
text = "0xFFFFFF"

[colors.normal]
black = "0x000000"
blue = "0xBD93F9"
cyan = "0x8BE9FD"
green = "0x50FA7B"
magenta = "0xFF79C6"
red = "0xFF5555"
white = "0xBFBFBF"
yellow = "0xF1FA8C"

[colors.primary]
#background = "0x1E1E2E"
#foreground = "0xF8F8F2"
# para transparencia
foreground = "#ffffff"
#background = "#0f1419"
background = "#000000"
