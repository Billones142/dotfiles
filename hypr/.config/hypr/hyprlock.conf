general {
    hide_cursor = false
}

# Configuración de animaciones (Reemplaza no_fade_in)
animations {
    enabled = true
    animation = fadeIn, 1, 3, default
}

auth {
    fingerprint {
        enabled = true
    }
}

background {
    monitor =
    path = ~/wallpaper-locked
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# ESTADO DE LA AUTENTICACION (Icono + Texto + Intentos)
label {
    monitor =
    text = cmd[update:500] echo "$($HOME/.config/hypr/scripts/auth_status.sh "$FAIL" "$FPRINTPROMPT" "$ATTEMPTS")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 18
    font_family = JetBrains Mono Nerd Font Mono
    position = 0, -180
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = JetBrains Mono Nerd Font Mono
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
    
    fail_color = rgb(204, 34, 34)
    fail_text =
}

# ESTADO DE ACCION DE ENERGIA PENDIENTE (cuenta regresiva de 30s)
label {
    monitor =
    text = cmd[update:1000] echo "$($HOME/.config/hypr/scripts/lock_power_status.sh)"
    color = rgba(255, 255, 255, 0.85)
    font_size = 14
    font_family = JetBrains Mono Nerd Font Mono
    position = 0, 75
    halign = center
    valign = bottom
}

# BOTONES DE ENERGIA (Apagar, Reiniciar, Cerrar sesion, Cambiar usuario)
label {
    monitor =
    text = 󰐥
    color = rgba(255, 255, 255, 0.75)
    font_size = 22
    font_family = JetBrains Mono Nerd Font Mono
    onclick = $HOME/.config/hypr/scripts/lock_power_action.sh poweroff
    position = -120, 40
    halign = center
    valign = bottom
}

label {
    monitor =
    text = 󰜉
    color = rgba(255, 255, 255, 0.75)
    font_size = 22
    font_family = JetBrains Mono Nerd Font Mono
    onclick = $HOME/.config/hypr/scripts/lock_power_action.sh reboot
    position = -40, 40
    halign = center
    valign = bottom
}

label {
    monitor =
    text = 󰍃
    color = rgba(255, 255, 255, 0.75)
    font_size = 22
    font_family = JetBrains Mono Nerd Font Mono
    onclick = $HOME/.config/hypr/scripts/lock_power_action.sh logout
    position = 40, 40
    halign = center
    valign = bottom
}

label {
    monitor =
    text = 󰍉
    color = rgba(255, 255, 255, 0.75)
    font_size = 22
    font_family = JetBrains Mono Nerd Font Mono
    onclick = $HOME/.config/rofi/power_menu.sh "󰍉 Cambiar Usuario"
    position = 120, 40
    halign = center
    valign = bottom
}

# HORA
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 120
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = 0, -300
    halign = center
    valign = top
}

# FECHA
label {
    monitor =
    text = cmd[update:1000] echo "$(LC_TIME=es_ES.UTF-8 date +"%A, %d de %B")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 24
    font_family = JetBrains Mono Nerd Font Mono Semibold
    position = 0, -520
    halign = center
    valign = top
}

# BATERIA
label {
    monitor =
    text = cmd[update:1000] echo "$($HOME/.config/hypr/scripts/battery_status.sh)"
    color = rgba(255, 255, 255, 1.0)
    font_size = 18
    font_family = JetBrains Mono Nerd Font Mono
    position = 30, -30
    halign = left
    valign = top
}

# RED
label {
    monitor =
    text = cmd[update:1000] echo "$($HOME/.config/hypr/scripts/network_status.sh)"
    color = rgba(255, 255, 255, 1.0)
    font_size = 18
    font_family = JetBrains Mono Nerd Font Mono
    position = 30, -60
    halign = left
    valign = top
}

# KDE CONNECT
label {
    monitor =
    text = cmd[update:1000] echo "$($HOME/.config/hypr/scripts/kdeconnect_status.sh)"
    color = rgba(255, 255, 255, 1.0)
    font_size = 16
    font_family = JetBrains Mono Nerd Font Mono
    position = -30, 30
    halign = right
    valign = bottom
}
