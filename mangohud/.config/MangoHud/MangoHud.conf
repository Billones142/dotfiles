cpu_mhz
cpu_temp
cpu_color=2E97CB

# ram
ram
ram_color=C26693
swap
procmem


#gpu
gpu_stats
gpu_load_change
gpu_load_value=50,90
gpu_load_color=FFFFFF,FFAA7F,CC0000
vram
vram_color=AD64C1
gpu_mem_clock
gpu_core_clock
gpu_temp
gpu_fan
gpu_color=2E9762
throttling_status

#battery
battery
battery_color=00FF00
battery_watt
battery_time
device_battery=gamepad
device_battery_icon

#performance
fps
frame_timing
frametime_color=00FF00
fps_color_change

#limits
fps_limit_method=early
#vsync=3
vsync=1
gl_vsync=-1
fps_color=B22222,FDFD09,39F900
