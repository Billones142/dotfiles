# GUI
legacy_layout=0
background_alpha=0.0
alpha=0.7
round_corners=0
background_color=000000
font_size=12
text_color=FFFFFF
position=top-left
hud_compact
table_columns=3

# cpu
cpu_stats
cpu_load_change
