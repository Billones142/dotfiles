#other
winesync
gamemode
dx_api
time
time_no_label

#performance logs
output_folder=$USER/.local/state/mangohud_logs/
log_duration=30
log_interval=100

#keybinds
toggle_fps_limit=Shift_L+F1
toggle_logging=Shift_L+F2
toggle_hud=Shift_R+F12

